<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jurisummarizer - AI למשרדי עורכי דין</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; } /* מונע מהתוכן לחרוג מהרווח שהגדרנו */
        body { 
            font-family: 'Assistant', sans-serif; 
            background-color: #0f172a; 
            color: #f1f5f9; 
            margin: 0; padding: 0; 
            direction: rtl; 
            overflow-x: hidden; /* מבטל גלילה לצדדים */
        }
        header { padding: 1.5rem; text-align: center; }
        .logo { font-size: 1.8rem; font-weight: 700; color: #38bdf8; }
        
        .hero { 
            display: flex; flex-direction: column; align-items: center; 
            padding: 1rem; text-align: center; 
        }
        h1 { font-size: 1.8rem; margin-bottom: 0.8rem; }
        h1 span { color: #38bdf8; }
        p.subtitle { color: #94a3b8; font-size: 0.95rem; max-width: 90%; margin: 0 auto 1.5rem auto; }

        /* התיקון הקריטי למרכוז ומניעת חיתוך */
        .tally-wrapper {
            width: calc(100% - 20px); /* משאיר מרווח בטחון מהצדדים */
            max-width: 400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            height: 320px; /* גובה קבוע כדי למנוע קפיצות */
        }
        
        iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100% !important;
            height: 100% !important;
            border: none;
        }

        .features { 
            display: grid; gap: 1rem; padding: 2rem 1rem; 
            max-width: 400px; margin: 0 auto; 
        }
        .feature-card { 
            background: #1e293b; padding: 1rem; border-radius: 12px; 
            border: 1px solid rgba(255, 255, 255, 0.05); text-align: center;
        }
        .feature-card h3 { color: #38bdf8; font-size: 1.1rem; margin-bottom: 0.5rem; }
        footer { padding: 1.5rem; text-align: center; font-size: 0.75rem; color: #64748b; }
    </style>
</head>
<body>
    <header><div class="logo">Jurisummarizer</div></header>
    <section class="hero">
        <h1>ה-AI שקורא <span>פרוטוקולים</span> במקומך</h1>
        <p class="subtitle">הצטרפו לבטא הסגורה והפכו סריקות לקבצי Word עריכים בשניות.</p>
        
        <div class="tally-wrapper">
            <iframe data-tally-src="https://tally.so/embed/BzAbo5?alignLeft=0&hideTitle=0&transparentBackground=1&dynamicHeight=0&v=3" 
                    frameborder="0" title="Registration"></iframe>
        </div>
    </section>

    <section class="features">
        <div class="feature-card"><h3>OCR משפטי מתקדם</h3><p>המרה מדויקת של סריקות למסמכי Word עריכים בעברית.</p></div>
    </section>

    <script async src="https://tally.so/widgets/embed.js"></script>
    <footer>&copy; 2026 Jurisummarizer AI</footer>
</body>
</html>
